services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag_pdf_chat
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rag_user -d rag_pdf_chat" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Redis Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # RAG PDF Chat Backend
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://rag_user:rag_password@postgres:5432/rag_pdf_chat
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_MODEL=gemini-2.0-flash
      - ARQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    entrypoint: [ "/app/entrypoint.sh" ]
    command: [ "python", "-m", "uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1" ]

  # Arq Worker for Background Processing
  worker:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://rag_user:rag_password@postgres:5432/rag_pdf_chat
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_MODEL=gemini-2.0-flash
      - ARQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    entrypoint: [ "/app/entrypoint.sh" ]
    command: [ "/app/.venv/bin/python", "start_arq_worker.py" ]
    restart: unless-stopped
    deploy:
      replicas: 3 # Increase this number to scale workers
    healthcheck:
      test: [ "CMD", "/app/.venv/bin/python", "-c", "import redis; r = redis.Redis.from_url('redis://redis:6379/0'); r.ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      - backend
    entrypoint: [ "/app/entrypoint.sh" ]
    command: [ "streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false" ]

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
