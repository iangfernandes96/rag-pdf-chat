[project]
name = "rag-pdf-chat"
version = "0.1.0"
description = "Local RAG PDF Chat app with document upload and question answering capabilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.28.0",
    "python-multipart>=0.0.6",
    "qdrant-client>=1.6.9",
    "psycopg2-binary>=2.9.7",
    "asyncpg>=0.29.0",
    "langchain>=0.0.340",
    "langchain-community>=0.0.12",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "reportlab>=4.0.0",
    "arq>=0.26.3",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]
