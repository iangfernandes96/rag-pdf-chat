[project]
name = "rag-pdf-chat"
version = "0.1.0"
description = "A multi-service RAG PDF Chat app using FastAPI, Streamlit, and Arq"
authors = [
    { name = "Ian Fernandes", email = "you@example.com" }
]
requires-python = ">=3.10"

# Only the shared or essential deps go here (optional)
dependencies = [
]

[tool.hatch.build.targets.wheel]
packages = ["rag_pdf_chat"]

[project.optional-dependencies]
# Backend server: FastAPI, embedding, vector DB
backend = [
    "fastapi",
    "arq",
    "uvicorn[standard]",
    "pymupdf",  # PDF parsing
    "langchain",
    "qdrant-client",
    "asyncpg",
    "redis[hiredis]",
    "python-dotenv",
    "pydantic",
    "httpx",
    "reportlab",
    "google-generativeai",
    "python-multipart",
    "sentence-transformers",
]

# Worker: Arq for async jobs, Redis, GenAI client
worker = [
    "arq",
    "asyncpg",
    "pymupdf",
    "numpy",
    "python-dotenv",
    "redis[hiredis]",
    "qdrant-client",
    "sentence-transformers",
]

# Frontend: Streamlit for user interface
frontend = [
    "streamlit",
    "httpx",
]

# Dev tools (you can install via `uv pip install '.[dev]'`)
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["migrations", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
