[project]
name = "rag-pdf-chat"
version = "0.1.0"
description = "Local RAG PDF Chat app with document upload and question answering capabilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pdfplumber>=0.10.0",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.28.0",
    "python-multipart>=0.0.6",
    "qdrant-client>=1.6.9",
    "psycopg2-binary>=2.9.7",
    "asyncpg>=0.29.0",
    "langchain>=0.0.340",
    "langchain-community>=0.0.12",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "black>=23.11.0",
    "ruff>=0.1.6",
]
