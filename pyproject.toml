[project]
name = "rag-pdf-chat"
version = "0.1.0"
description = "Local RAG PDF Chat app with document upload and question answering capabilities"
authors = [
    { name = "Ian Fernandes", email = "iangfernandes@gmail.com" }
]
requires-python = ">=3.13"

# Only the shared or essential deps go here (optional)
dependencies = [
]

[tool.hatch.build.targets.wheel]
packages = ["rag_pdf_chat"]

[project.optional-dependencies]
# Backend server: FastAPI, embedding, vector DB
backend = [
    "fastapi",
    "arq",
    "uvicorn[standard]",
    "pymupdf",  # PDF parsing
    "langchain",
    "qdrant-client",
    "asyncpg",
    "redis[hiredis]",
    "python-dotenv",
    "pydantic",
    "httpx",
    "reportlab",
    "google-generativeai",
    "python-multipart",
    "sentence-transformers",
]

# Worker: Arq for async jobs, Redis, GenAI client
worker = [
    "arq",
    "asyncpg",
    "pymupdf",
    "numpy",
    "python-dotenv",
    "redis[hiredis]",
    "qdrant-client",
    "sentence-transformers",
]

# Frontend: Streamlit for user interface
frontend = [
    "streamlit",
    "httpx",
]

# Dev tools (you can install via `uv pip install '.[dev]'`)
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
